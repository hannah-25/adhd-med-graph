name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  verify:
    name: test lint architecture-check docs-check security-check deploy-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm install

      - name: Verify
        run: npm run agent:verify
